name: Native headless builds

# Static (or, on macOS, system-libraries-only) headless rvvm binaries without any GUI backend (no X11, Wayland, SDL),
# built natively on each platform and boot-tested with a tiny Linux guest, both with the JIT and with -nojit, then run through the
# snapshot tests (ci/snapshot_test.py: save, resume, map the RAM image, several copies) the same two ways.
on:
  push:
    branches: [native-headless-ci, net-mux, snapshot-ram-state]
    paths: ['.github/workflows/native-headless.yml', 'ci/**', 'src/**']
    # Pushing a tag rvvm-<anything> builds, smoke-boots and then publishes a release of that commit (see `release`).
    tags: ['rvvm-*']
  workflow_dispatch:

env:
  HEADLESS: USE_GUI=0 USE_X11=0 USE_WAYLAND=0 USE_SDL=0 USE_NO_DLIB=1 USE_LIB=0

jobs:
  guest:
    name: Smoke guest (OpenSBI + Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: smoke-guest-out
          key: smoke-guest-${{ hashFiles('ci/smoke-guest/**') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libssl-dev libelf-dev
          sh ci/smoke-guest/build.sh "$PWD/smoke-guest-out"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-guest
          path: smoke-guest-out
          retention-days: 5

  build:
    name: ${{ matrix.name }}
    needs: guest
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            make: make LDFLAGS=-static
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            make: make LDFLAGS=-static
          - name: macos-arm64
            runner: macos-26
            make: make CFLAGS="-target arm64-apple-macos11" USE_COCOA_GUI=0
          - name: macos-x86_64
            runner: macos-26-intel
            make: make CFLAGS="-target x86_64-apple-macos10.13" USE_COCOA_GUI=0
          - name: windows-x86_64
            runner: windows-2022
            make: make LDFLAGS=-static USE_WIN32_GUI=0
            msys: true
    defaults:
      run:
        shell: ${{ matrix.msys && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: msys2/setup-msys2@v2
        if: matrix.msys
        with:
          msystem: UCRT64
          install: make python mingw-w64-ucrt-x86_64-gcc
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-guest
          path: smoke-guest
      - name: Build
        run: ${{ matrix.make }} ${{ env.HEADLESS }} BUILDDIR=build
      - name: Binary
        run: |
          ls -l build
          case "${{ matrix.name }}" in
            linux-*) file build/rvvm_*; if ldd build/rvvm_x86_64 build/rvvm_arm64 2>/dev/null | grep -q '=>'; then echo 'dynamic libraries found'; exit 1; fi ;;
            macos-*) file build/rvvm_*; otool -L build/rvvm_* ;;
            windows-*) ls -l build/*.exe ;;
          esac
      - name: Smoke boot (JIT)
        run: python3 ci/smoke_run.py "build/$(ls build | grep -E '^rvvm_(x86_64|arm64)(\.exe)?$' | head -1)" smoke-guest
      - name: Smoke boot (-nojit)
        run: python3 ci/smoke_run.py "build/$(ls build | grep -E '^rvvm_(x86_64|arm64)(\.exe)?$' | head -1)" smoke-guest -nojit
      - name: Snapshot tests (JIT)
        run: python3 ci/snapshot_test.py "build/$(ls build | grep -E '^rvvm_(x86_64|arm64)(\.exe)?$' | head -1)" smoke-guest
      - name: Snapshot tests (-nojit)
        run: python3 ci/snapshot_test.py "build/$(ls build | grep -E '^rvvm_(x86_64|arm64)(\.exe)?$' | head -1)" smoke-guest -nojit
      - name: Snapshot timing (1536 MB guest, like the local VM)
        env:
          SNAP_MEM_MB: 1536
        run: python3 ci/snapshot_test.py "build/$(ls build | grep -E '^rvvm_(x86_64|arm64)(\.exe)?$' | head -1)" smoke-guest
      - uses: actions/upload-artifact@v4
        with:
          name: rvvm-${{ matrix.name }}
          path: |
            build/rvvm_*
            !build/*/
          retention-days: 30

  # Publishes the emulator binaries that passed the smoke boots above as a release, only for a pushed tag rvvm-* (a
  # branch push never publishes). One asset per host, named rvvm-<host>[.exe], plus SHA256SUMS: consumers pin the hash of each file they
  # use. Only the system emulator is released (rvvm_<arch>), not the user-mode one that is built beside it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/rvvm-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rvvm-*
          path: built
      - name: Name the assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir assets
          for d in built/rvvm-*; do
            host=${d#built/rvvm-}
            f=$(ls "$d" | grep -E '^rvvm_(x86_64|arm64)(\.exe)?$' | head -n1)
            test -n "$f" || { echo "::error::no rvvm_<arch> in $d"; exit 1; }
            ext=""; case "$f" in *.exe) ext=.exe;; esac
            cp "$d/$f" "assets/rvvm-$host$ext"
          done
          (cd assets && sha256sum -- * | tee SHA256SUMS)
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::release $tag already exists"; exit 1; fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Headless rvvm $tag" \
            --notes "Headless static builds (no X11, Wayland or SDL) of $GITHUB_SHA, built and smoke-booted (JIT and -nojit) by run $GITHUB_RUN_ID. Pin each file by its sha256 in SHA256SUMS." assets/*
